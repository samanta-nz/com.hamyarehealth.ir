name: Health release — build, ParsPack, GitHub Release

# «همیار سلامتی من» — تنها ورک‌فلوی این ریپو.
# هر push روی main: تست + کامپایل + ساخت APK انتشار + GitHub Release + آپلود روی ParsPack.
# نسخه از apps/hamyar-health/build.gradle.kts خوانده می‌شود (versionCode/versionName).
# برای انتشار نسخهٔ تازه، همان دو عدد را بالا ببر و push کن.

on:
  push:
    branches: [main]
    paths:
      - "apps/hamyar-health/**"
      - "shared/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "config/**"
      - "scripts/**"
      - ".github/workflows/release-health.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "یادداشت Release؛ در حالت خالی از commit جاری استفاده می‌شود"
        required: false
        default: ""
        type: string
      upload_to_parspack:
        description: "آپلود APK روی ParsPack (پیش‌فرض: بله)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: health-release
  cancel-in-progress: false

env:
  PACKAGE: com.hamyarehealth.ir
  APP_ID: health
  VERSION_FILE: apps/hamyar-health/build.gradle.kts
  PARSPACK_KEY_PREFIX: apk/health

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          version_file = Path(os.environ["VERSION_FILE"])
          text = version_file.read_text(encoding="utf-8")

          def parse(source: str):
              code_m = re.search(r"^\s*versionCode\s*=.*\?:\s*(\d+)\s*$", source, re.M)
              name_m = re.search(r'^\s*versionName\s*=.*\?:\s*"([^"]+)"\s*$', source, re.M)
              if not code_m or not name_m:
                  raise SystemExit("versionCode/versionName قابل استخراج نیست.")
              return int(code_m.group(1)), name_m.group(1).strip()

          code, name = parse(text)
          if code <= 0 or not re.fullmatch(r"\d+\.\d+\.\d+", name):
              raise SystemExit(f"نسخه نامعتبر است: {name} / {code}")

          event = os.environ["EVENT_NAME"]
          before = os.environ.get("BEFORE_SHA", "")
          release_needed = True

          if event == "push" and re.fullmatch(r"[0-9a-f]{40}", before or ""):
              try:
                  previous = subprocess.check_output(
                      ["git", "show", f"{before}:{version_file.as_posix()}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  previous = ""
              if previous:
                  previous_code, previous_name = parse(previous)
                  if code == previous_code and name == previous_name:
                      release_needed = False
                  elif code <= previous_code:
                      raise SystemExit(
                          f"versionCode باید افزایشی باشد: قبلی {previous_code} → فعلی {code}"
                      )

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"VERSION_NAME={name}\n")
              out.write(f"VERSION_CODE={code}\n")
              out.write(f"RELEASE_NEEDED={'true' if release_needed else 'false'}\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version_name={name}\n")
              out.write(f"version_code={code}\n")
              out.write(f"release_needed={'true' if release_needed else 'false'}\n")

          print(f"version={name}")
          print(f"versionCode={code}")
          print(f"releaseNeeded={release_needed}")
          PY

      # سیاست انتشار: همیشه بیلد می‌شود؛ Release/ParsPack فقط وقتی نسخه عوض شده باشد.
      - name: Test, compile and build release APK
        run: |
          set -euo pipefail
          ./gradlew --console=plain --stacktrace \
            :core-common:testDebugUnitTest \
            :hamyar-health:testDebugUnitTest \
            :hamyar-health:compileReleaseKotlin \
            :hamyar-health:assembleRelease

      - name: Collect and verify APK
        run: |
          set -euo pipefail
          mkdir -p dist ci-report
          mapfile -t files < <(find apps/hamyar-health/build/outputs/apk/release -type f -name '*.apk' -print)
          test "${#files[@]}" -eq 1
          APK="dist/hamyar-health-$VERSION_NAME.apk"
          cp -f "${files[0]}" "$APK"
          test -s "$APK"

          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          grep -F "name='$PACKAGE'" <<<"$BADGING"
          grep -F "versionCode='$VERSION_CODE'" <<<"$BADGING"
          grep -F "versionName='$VERSION_NAME'" <<<"$BADGING"
          grep -F "application-label:'همیار سلامتی من'" <<<"$BADGING"

          SIGNER="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')"
          EXPECTED="$(tr -d '[:space:]' < config/release-signing-sha256.txt | tr -d ':-' | tr 'A-F' 'a-f')"
          test -n "$SIGNER"
          test "$SIGNER" = "$EXPECTED"

          APK_SIZE="$(stat -c%s "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          echo "SIGNER_SHA256=$SIGNER" >> "$GITHUB_ENV"
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$APK_SHA256" "$APK" > ci-report/apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-health-${{ steps.version.outputs.version_name }}
          path: dist/*.apk
          retention-days: 30

      - name: Prepare release notes
        if: ${{ steps.version.outputs.release_needed == 'true' }}
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_NOTES_INPUT:-}" ]; then
            printf '%s\n' "$RELEASE_NOTES_INPUT" > release-notes.md
          else
            git show -s --format=%B "$GITHUB_SHA" > release-notes.md
          fi
          {
            echo
            echo "---"
            echo "اپ: همیار سلامتی من"
            echo "نسخه: $VERSION_NAME ($VERSION_CODE)"
            echo "پکیج: $PACKAGE"
            echo "SHA-256 فایل: $APK_SHA256"
          } >> release-notes.md

      - name: Publish GitHub Release
        if: ${{ steps.version.outputs.release_needed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="health-v$VERSION_NAME"
          APK="dist/hamyar-health-$VERSION_NAME.apk"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "همیار سلامتی من $VERSION_NAME" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          ASSET="$(basename "$APK")"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
          READY=false
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --range 0-1023 "$URL" -o /tmp/github-apk-head.bin; then
              READY=true
              break
            fi
            sleep 5
          done
          test "$READY" = "true"
          test "$(head -c 2 /tmp/github-apk-head.bin)" = "PK"
          echo "GITHUB_RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_ENV"
          echo "EXTERNAL_URL=$URL" >> "$GITHUB_ENV"

      # کلیدهای پارس‌پک قابل‌خواندن نیستند (Secrets فقط نوشتنی است). اگر در این
      # مخزن تنظیم نشده باشند، انتشار روی GitHub Release انجام می‌شود و آپلود
      # پارس‌پک فقط با هشدار رد می‌شود — بیلد هرگز به‌خاطر نبودِ کلید شکست نمی‌خورد.
      - name: Check ParsPack secrets
        id: parspack
        if: ${{ steps.version.outputs.release_needed == 'true' }}
        env:
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${PARSPACK_ACCESS_KEY:-}" ] && [ -n "${PARSPACK_SECRET_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::کلیدهای پارس‌پک در این مخزن تنظیم نشده‌اند؛ آپلود APK روی پارس‌پک انجام نشد."
          fi

      - name: Upload to ParsPack and verify anonymous read
        if: ${{ steps.version.outputs.release_needed == 'true' && steps.parspack.outputs.enabled == 'true' && (github.event_name == 'push' || inputs.upload_to_parspack == true) }}
        env:
          PARSPACK_ACCESS_KEY: ${{ secrets.PARSPACK_ACCESS_KEY }}
          PARSPACK_SECRET_KEY: ${{ secrets.PARSPACK_SECRET_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet boto3 requests
          # نسخه‌دار (تاریخی)
          python3 scripts/put_public_object.py \
            --file "dist/hamyar-health-$VERSION_NAME.apk" \
            --key "$PARSPACK_KEY_PREFIX/hamyar-health-$VERSION_NAME.apk" \
            --provider parspack \
            --content-type application/vnd.android.package-archive \
            --env-name INTERNAL_URL
          # آخرین نسخه (نشانی ثابت برای پشتیبانی و دانلود مستقیم)
          python3 scripts/put_public_object.py \
            --file "dist/hamyar-health-$VERSION_NAME.apk" \
            --key "$PARSPACK_KEY_PREFIX/hamyar-health-latest.apk" \
            --provider parspack \
            --content-type application/vnd.android.package-archive \
            --env-name INTERNAL_URL_LATEST

      - name: Final summary
        run: |
          set -euo pipefail
          echo "APP=همیار سلامتی من"
          echo "PACKAGE=$PACKAGE"
          echo "VERSION=$VERSION_NAME ($VERSION_CODE)"
          echo "APK_SIZE=$APK_SIZE"
          echo "APK_SHA256=$APK_SHA256"
          echo "BUILD=SUCCESS"
          if [ "$RELEASE_NEEDED" = "true" ]; then
            echo "GITHUB_RELEASE=${GITHUB_RELEASE_URL:-SUCCESS}"
            echo "PARSPACK_URL=${INTERNAL_URL:-SUCCESS}"
            echo "PARSPACK_LATEST=${INTERNAL_URL_LATEST:-SUCCESS}"
          else
            echo "RELEASE=SKIPPED (نسخه عوض نشده — فقط بیلد)"
          fi
